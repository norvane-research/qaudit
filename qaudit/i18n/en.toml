data = "It covers only the data submitted. It cannot establish that a history was not truncated beyond the consistency checks applied, nor that live execution will reproduce the prices in the file."
truncation = "It establishes neither the identity of the system's author nor ownership of the strategy; it establishes that a precise file passed a precise method."
revision = "It lapses for any later version of the method: a change of threshold creates a new method, which requires a new audit."

