stop_geometry_info = "Stop sensitivity: −10 % → {collapse_10:.0%} of gross profit lost, −20 % → {collapse_20:.0%}, −30 % → {collapse_30:.0%} ({winners} winners); +10 % → {survived_10:.0%} of losers spared, +20 % → {survived_20:.0%}, +30 % → {survived_30:.0%}."
