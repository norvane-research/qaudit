triggered = "Une barrière déclenchée → NO-GO."
majors = "{n} constats majeurs ou plus → GO SOUS CONDITIONS au mieux."
unevaluated = "Une barrière non évaluée (données manquantes) → condition ; le verdict ne peut pas être GO."
band = "Une valeur dans la bande d'indécision → verdict rendu, revue humaine requise (porte E3)."
sample = "Moins de {n} trades utilisables → constat bloquant « échantillon insuffisant »."

[methode.detector]
martingale = "Augmentation du volume après une perte (rapport de volume ≥ ratio_min), sur une part des trades post-perte ; contraste exigé avec le comportement après gain."
grid = "Ajout de positions à une position perdante de même sens à prix pire, refermées ensemble (panier) ; part des trades concernés."
no_stop = "Part des trades sans stop-loss renseigné."
profit_concentration = "Part du gain brut apportée par les meilleurs trades (top_fraction) ; profit net une fois retirés les meilleurs (remove_fraction)."
equity_linearity = "Courbe d'equity anormalement linéaire : R² contre l'indice du trade au-dessus de r2_major."
payoff_asymmetry = "Taux de réussite très élevé combiné à un ratio gain moyen / perte moyenne très faible."
period_dependence = "Part du profit net apportée par un seul trimestre, sur au moins min_periods trimestres."
holding_time = "Durées de position irréalistes : part des trades de moins de min_seconds, ou de plus de max_days."
stop_geometry = "Avec prix : part du gain brut qui disparaît si le stop est resserré de 10 %, 20 %, 30 %."
lookahead = "Avec prix : part des entrées exactement au plus bas / plus haut de leur barre, testée contre le hasard (p-value)."
execution_realism = "Avec prix : part des prix d'entrée ou de sortie hors de la fourchette haut–bas de leur barre (tolérance en points de base)."

[methode.sim]
iterations = "{n} itérations pour le bootstrap, la permutation et la nulle, chacune sur un flux aléatoire indépendant dérivé de la graine (rangs fixes)."
bootstrap = "Bootstrap : {method}."
permutation = "Permutation d'ordre : le tableau d'entrée n'est jamais modifié ; le profit total est invariant."
null = "Nulle sans edge : distributions empiriques des gains et des pertes conservées, fréquence neutralisée."
dsr = "Nombre d'essais par défaut : {n} ; grille de sensibilité : {grid}."
walkforward = "Walk-forward : {folds} plis, protocole {protocol}, sélection au {selection}."
