[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qaudit"
version = "1.0.0"
description = "Audit and validation engine for trading systems: GO / CONDITIONAL / NO-GO from a trade history, deterministic and offline."
readme = "README.md"
requires-python = ">=3.11"
# Expression de licence SPDX (PEP 639) : les classifiers « License :: » sont
# alors interdits par setuptools ≥ 77.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
keywords = ["trading", "backtest", "metatrader", "prop-firm", "deflated-sharpe", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
]
build = [
    "pyinstaller>=6",
]

[project.scripts]
qaudit = "qaudit.cli.main:main"

[project.gui-scripts]
qaudit-gui = "qaudit.gui.app:main"

[tool.setuptools.packages.find]
include = ["qaudit*"]

[tool.setuptools.package-data]
qaudit = [
    "py.typed",
    "i18n/*.toml",
    "io/methods/*.toml",
    "io/rulesets/*.toml",
    "io/profils/*.toml",
    "io/writers/schema/*.json",
    "io/writers/templates/*.html",
    "demo/*.csv",
    "demo/walkforward/*.csv",
    "demo/*.toml",
]

# ---------------------------------------------------------------------------
# pytest — tout avertissement numpy/pandas non traité est une erreur (N-12)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# mypy --strict, sans échappatoire (N-05). scipy et pandas ne publient pas de
# py.typed : les signatures utilisées sont déclarées dans stubs/ et vérifiées.
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
mypy_path = "stubs"
files = ["qaudit", "tests"]
warn_unreachable = true
show_error_codes = true

# ---------------------------------------------------------------------------
# ruff — complexité cyclomatique ≤ 10 (N-06), interdiction de l'aléatoire
# global numpy (NPY002), des except aveugles (BLE), des try/except-pass (S110).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["qaudit", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "SIM", "C90", "RUF", "PIE", "RET",
    "PT", "BLE", "S110", "S112", "T20", "A", "ISC", "ICN", "ERA", "PERF", "NPY",
]
ignore = [
    "ISC001",  # incompatible avec le formateur
]
# Notation mathématique et typographie française dans les docstrings/commentaires.
allowed-confusables = [
    "−", "–", "×", "·", "γ", "α", "β", "ρ", "σ", "μ", "Φ", "ν", "ε", "ο", "Τ", "Ζ",
    "’", "‘", "«", "»", "…", "ᵉ", "₀", "₃", "₄", "ⁿ", "ℓ",
]

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.per-file-ignores]
"qaudit/cli/**" = ["T20"]
# « io » est un sous-paquet imposé par l'architecture (qaudit.io) ; sous les
# imports absolus il ne masque pas le module standard.
"qaudit/io/__init__.py" = ["A005"]
# scripts d'assemblage (site, index local) : textes de prose en ligne, sortie console
"packaging/build_site.py" = ["E501", "C901", "T20", "RET504"]
"packaging/export_public.py" = ["T20"]
"interne/build_index.py" = ["E501", "C901", "T20", "RET504", "ISC", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["qaudit"]

# ---------------------------------------------------------------------------
# couverture — mesurée sur core/ (N-07 ≥ 90 %)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["qaudit/core"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
